---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke
  namespace: demo
spec:
  metrics:
    - name: smoke
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: busybox:1.36
                    command: ["sh", "-c", "echo ok; exit 0"]
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-canary
  namespace: demo
spec:
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: demo-canary
  template:
    metadata:
      labels:
        app: demo-canary
    spec:
      containers:
        - name: app
          image: argoproj/rollouts-demo:blue
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
  strategy:
    canary:
      analysis:
        templates:
          - templateName: smoke
        startingStep: 0
      steps:
        - setWeight: 25
        - pause: {}
