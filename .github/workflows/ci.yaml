---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
      # No committed package-lock.json, so npm install (not npm ci).
      - run: npm install
      - run: npm run lint
      - run: npm run tsc
      - run: npm run build
      - name: Test
        run: |
          if [ -n "$(find src -name '*.test.ts' -o -name '*.test.tsx')" ]; then
            npm test
          else
            echo "No test files, skipping"
          fi
      - name: i18n catalog is up to date
        run: |
          npm run i18n
          if ! git diff --quiet -- locales; then
            echo "::error::locales/ is stale. Run 'npm run i18n' and commit the result."
            git diff -- locales
            exit 1
          fi

  # Headlamp version compatibility: type-check + build against the pinned SDK
  # (required) and the latest SDK (advisory) to catch API drift. The declared
  # Headlamp range lives in artifacthub-pkg.yml (headlamp/plugin/version-compat).
  compat:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.headlamp-plugin == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        headlamp-plugin: ["0.14.0", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
      - run: npm install
      - run: npm install --no-save "@kinvolk/headlamp-plugin@${{ matrix.headlamp-plugin }}"
      - run: npm run tsc
      - run: npm run build
