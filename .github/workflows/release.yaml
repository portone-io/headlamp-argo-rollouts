---
# Called by release-please (see release-please.yaml) after it creates a release
# and tag. Builds the plugin tarball at that tag and attaches it to the release,
# then appends the tarball's SHA256 to the release notes so consumers (e.g. the
# headlamp-plugins image) can pin it.
name: Release assets

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the plugin tarball to.
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      # No cache: input is set, so setup-node restores nothing (no cache to poison).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          npm run package
          tarball="$(ls headlamp-argo-rollouts-*.tar.gz)"
          checksum="$(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Attach tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARBALL: ${{ steps.pkg.outputs.tarball }}
          CHECKSUM: ${{ steps.pkg.outputs.checksum }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$TARBALL" --clobber
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo ""
            echo "Plugin tarball SHA256: \`$CHECKSUM\`"
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
